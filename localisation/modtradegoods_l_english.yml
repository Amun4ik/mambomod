decision_enable_modtradegoods_t:0 "ENABLE NEW TRADE GOODS!"
decision_enable_modtradegoods_d:0 "Enables new trade goods."

 horses:0 "Mounts"
 horsesDESC:0 "Mounts and pack animals, including camels, mules, oxen, and hardy saddle horses, were essential for transport, agriculture, and military logistics. Breeding and training required specialized knowledge, and good animals commanded high prices at fairs and markets. Caravans and armies depended on reliable mounts to move goods, messages, and troops across difficult terrain. Trade in such animals was often supervised by local authorities to ensure health, prevent disease, and maintain tax revenue."
 vodka:0 "Spirits"
 vodkaDESC:0 "Spirits are distilled beverages with high alcohol content, used for medicinal purposes, social drinking, and as a trade commodity. They were produced through the distillation of fermented grains, fruits, or vegetables, resulting in potent drinks like whiskey, brandy, vodka, and rum. Spirits were widely traded and consumed, often regulated by local authorities to control quality and taxation, and they played a significant role in both social life and economic trade networks."
 beer:0 "Beer"
 beerDESC:0 "Beer emerged as a staple trade good, essential for both daily consumption and economic activity. Brewed from grains like barley and wheat, it became a significant commodity, especially in Northern Europe. Beer production spurred agricultural growth, fostered trade, and supported urbanization. Its widespread popularity made it a reliable source of revenue, influencing local economies and trade networks. The beer trade also played a role in social and cultural life, with taverns becoming centers of community and commerce."
honey:0 "Honey"
honeyDESC:0 "Honey was a crucial resource both for everyday consumption and as a trade good. It was the primary sweetener before the widespread availability of sugar, used in cooking, baking, and preserving food. Honey also played a vital role in the production of mead, an alcoholic beverage popular in many European and African regions. Additionally, honey had medicinal uses, being applied to wounds for its healing properties and used in traditional remedies. Beekeeping was a common practice across Europe, Russia, and parts of Asia, making honey an essential part of rural economies."
 pearls:0 "Pearls"
 pearlsDESC:0 "Pearls are a luxurious and rare trade good, prized for their natural beauty and use in jewelry and ornamentation. Harvested from oysters in coastal waters, especially in regions like the Persian Gulf, Indian Ocean, and the Pacific, pearls have long been sought after by royalty and wealthy merchants. Their rarity and the labor-intensive process of diving for them make pearls one of the most valuable luxury items in global trade, symbolizing wealth, status, and elegance across many cultures."
pepper:0 "Pepper"
pepperDESC:0 "Pepper is a highly prized spice, originating from India, that became one of the most valuable trade goods during the medieval and early modern periods. Known as 'black gold', it was sought after for its ability to enhance flavor and preserve food. The spice was driving exploration and colonial expansion. Pepper's high demand and strategic importance made it a key commodity in the spice trade."
olives:0 "Olives"
olivesDESC:0 "Olives are a staple fruit of the Mediterranean region, valued for their oil and distinct, savory flavor. Cultivated for thousands of years, olives became central to Mediterranean diets and economies, symbolizing health, prosperity, and peace. Olive oil, extracted from the fruit, was widely traded and used for cooking, medicine, and religious ceremonies. Known for their resilience, olive trees thrive in warm, dry climates, making them a key agricultural product in regions like Greece, Italy, Spain, and North Africa."

marble:0 "Marble"
marbleDESC:0 "Marble is a valuable and durable stone prized for its beauty, strength, and versatility. Known for its distinctive veined patterns, marble has been used in art, architecture, and sculpture for thousands of years, symbolizing luxury and refinement. Quarried primarily in regions with specific geological conditions, marble is especially prominent in Mediterranean cultures, where it adorns temples, palaces, and monuments. Its high demand for construction and decorative arts made marble a significant trade good, sought after by builders, artists, and aristocrats alike."

whales:0 "Whales"
whalesDESC:0 "Whales are massive marine mammals prized historically for their valuable resources, especially whale oil and baleen. Whale oil, derived from blubber, was essential for lighting lamps and manufacturing soap, while baleen, or 'whalebone', was used in clothing and tools. Whaling became a significant industry in regions like the North Atlantic and the Pacific, with European and later American whalers hunting these giants at great risk. Although difficult and dangerous, whaling provided critical resources that fueled economies and seafaring cultures, especially in coastal communities."

nutmeg:0 "Nutmeg"
nutmegDESC:0 "Nutmeg is an aromatic spice derived from the seeds of trees native to the Banda Islands in Indonesia, historically known as the Spice Islands. Prized for its warm, slightly sweet flavor and medicinal properties, nutmeg became one of the most valuable spices in global trade. European powers fiercely contested control over its production due to its rarity and high demand, making it a key driver of exploration and colonial ambition. Nutmeg’s distinct flavor enriched dishes and medicines, symbolizing wealth and exotic luxury across the world."

lavender:0 "Herbs"
lavenderDESC:0 "Rare medicinal and aromatic herbs, such as lavender, sage, and other healing plants, were valuable for apothecaries, cooks, perfumers, and physicians. They were used in remedies, preservation, religious ceremonies, and household crafts, giving them steady demand among both commoners and elites. Harvesting and trade were often managed by local guilds and herbalists, who guarded knowledge of their preparation and quality. Their lightness and high value made them well suited to long-distance trade."

lumber:0 "Lumber"
lumberDESC:0 "Lumber is wood that has been processed into beams, planks, or boards, ready for construction and manufacturing. Derived from raw timber, lumber is a fundamental material in building structures, furniture, and various tools. Its strength, versatility, and availability make it essential in construction and woodworking, driving economies with abundant forests. Typically produced in sawmills, lumber ranges from rough, untreated boards to finely finished wood, adapted for numerous applications in industrial and residential projects."

dates:0 "Dates"
datesDESC:0 "Dates are a sweet, nutritious fruit from the date palm tree, widely cultivated in arid regions, especially the Middle East and North Africa. Known for their energy-rich qualities, dates have been a staple food and valuable trade commodity for centuries. Prized for their long shelf life and high sugar content, dates were essential for travelers and traders crossing deserts, as well as a dietary staple in many ancient civilizations. They are enjoyed fresh or dried and are used in both culinary dishes and traditional medicines, symbolizing hospitality and prosperity across cultures."

corn:0 "New World Crops"
cornDESC:0 "New World crops such as maize, potatoes, and tomatoes transformed agriculture and diets after their introduction to global trade. High yields and nutritional value supported population growth, while their cultivation spread across varied climates and soils. These crops became valuable commodities in colonial and local markets, encouraging settlement, exchange, and agricultural innovation. Authorities and landowners often regulated their distribution and quality, as reliable harvests were vital for feeding growing towns and armies."

jade:0 "Jade"
jadeDESC:0 "Jade is a precious stone revered for its beauty, durability, and cultural significance, particularly in East Asia and Mesoamerica. With shades ranging from deep green to milky white, jade has been carved into jewelry, sculptures, and ceremonial objects for thousands of years. In China, jade symbolizes purity, wisdom, and harmony, making it highly valued in art and spiritual traditions. Similarly, in Mesoamerican cultures like the Maya, jade was considered more precious than gold and was used in rituals and as a status symbol. Its rarity and spiritual associations have made jade a prized material throughout history."

cinnamon:0 "Cinnamon"
cinnamonDESC:0 "Cinnamon is a fragrant spice derived from the inner bark of trees native to South and Southeast Asia, particularly Sri Lanka and southern India. Known for its warm, sweet aroma and flavor, cinnamon has been highly valued for centuries in both culinary and medicinal uses. In ancient times, it was a luxury item traded along major routes to Europe, the Middle East, and East Asia. Coveted by merchants and explorers, cinnamon became a driving force in the spice trade, with European powers competing for control over its sources, especially during the colonial era."

poppy:0 "Poppy"
poppyDESC:0 "Poppy is a flowering plant known for its vibrant blooms and diverse uses. Cultivated for thousands of years, poppies are valued for their seeds, used in cooking and baking, and for their latex, which is the raw material for opium. Originating in the Mediterranean and widely cultivated in Asia, poppies have historical importance in medicine, especially as a source of pain-relieving compounds. Revered for both their beauty and medicinal properties, poppies have played a significant role in cultural, culinary, and pharmaceutical traditions worldwide."

saffron:0 "Saffron"
saffronDESC:0 "Saffron is a rare and luxurious spice derived from the delicate stigmas of the Crocus sativus flower. Known for its vibrant golden color and rich, earthy flavor, saffron is prized for culinary, medicinal, and dyeing purposes. Native to regions of the Middle East, particularly Persia, saffron has been cultivated for thousands of years and remains one of the most expensive spices in the world due to the labor-intensive harvesting process. Saffron’s unique qualities and rarity have made it a symbol of wealth and refinement across cultures."

cheese:0 "Cheese"
cheeseDESC:0 "Cheese is a flavorful, nutritious food made from the curdled milk of cows, goats, sheep, and other animals. With a vast variety of textures, flavors, and aging processes, cheese has been produced for thousands of years, especially in Europe and the Middle East, as a way to preserve milk. It ranges from fresh, soft varieties to hard, aged cheeses with complex flavors. Cheese is a staple in many diets, renowned for its versatility in cooking and its cultural significance, especially in regions like France, Italy, and Switzerland, which are famous for their traditional cheese-making techniques."

silver:0 "Silver"
silverDESC:0 "Silver is a precious metal prized for its beauty, durability, and versatility. Known for its brilliant luster and malleability, silver has been used for thousands of years in coinage, jewelry, and decorative art. With major deposits found in regions like the Americas, Central Europe, and Asia, silver was a driving force in global trade, particularly during the Age of Exploration. It became a key currency metal, fueling economies and enabling expansive trade networks. Silver’s value and aesthetic appeal have made it one of the most sought-after metals in human history."

rice:0 "Rice"
riceDESC:0 "Rice is a staple grain cultivated primarily in warm, wet climates across Asia, Africa, and the Americas. Known for its adaptability and high yield, rice provides essential nutrition to billions of people worldwide and is a foundational ingredient in numerous cuisines. From the terraced paddies of Asia to the river plains of Africa, rice farming is deeply embedded in cultural traditions, with varieties like jasmine, basmati, and sticky rice each lending unique flavors and textures to dishes. As a critical food crop, rice has shaped economies, agriculture, and culinary practices for thousands of years."

fruits:0 "Fruits"
fruitsDESC:0 "Fruits are nutritious, sweet, and often juicy foods that grow on various trees, bushes, and plants in temperate and subtropical climates. Common varieties, such as apples, pears, berries, and plums, are valued for their vitamins, minerals, and fiber, making them essential in balanced diets worldwide. Often enjoyed fresh, dried, or preserved, these fruits have been cultivated for centuries and hold cultural significance in many culinary traditions. Their natural sweetness and refreshing flavors make them a favorite in both everyday meals and desserts."

exoticfruits:0 "Exotic Fruits"
exoticfruitsDESC:0 "Exotic fruits are unique, flavorful, and often tropical fruits found in regions outside of temperate climates. Known for their vibrant colors, unusual shapes, and rich, diverse flavors, exotic fruits like mangoes, papayas, dragon fruit, and passion fruit offer distinct tastes and nutritional benefits. Many of these fruits are staple foods in their native regions, used in cooking, desserts, and beverages, and are prized in global markets for their novelty and health properties. Often rare and challenging to cultivate outside their native habitats, exotic fruits add a sense of adventure and luxury to culinary experiences worldwide."

stone:0 "Stone"
stoneDESC:0 "Quarried stones such as sandstone, limestone, and granite are essential building materials prized for their durability, versatility, and natural beauty. Extracted from stone quarries, these stones have been used for thousands of years in architecture, sculpture, and infrastructure. Limestone and sandstone are especially valued for their workability and aesthetic appeal, often appearing in historic buildings, monuments, and city walls, while granite’s strength makes it ideal for foundations and heavy construction. Quarried stones are a cornerstone of architectural heritage, symbolizing both practicality and artistic expression across cultures."

seafood:0 "Exotic Seafood"
seafoodDESC:0 "Exotic seafood such as turtles, lobsters, and flying fish supplied luxury markets and coastal courts with rare and prestigious delicacies. Because many of these creatures were difficult to catch and spoil quickly, successful trade depended on fast transport, salting, drying, and reliable port networks. Their rarity made them symbols of status and wealth, especially in inland markets far from the sea. Local authorities and fishing guilds regulated catches and sales to protect both revenue and supply."

gunpowder:0 "Gunpowder"
gunpowderDESC:0 "Gunpowder is a powerful explosive mixture of saltpeter (potassium nitrate), charcoal, and sulfur, invented in China around the 9th century. This revolutionary substance enabled the development of firearms, cannons, and explosives, dramatically transforming warfare. First used in firecrackers and early siege weapons, gunpowder spread along trade routes to the Middle East and Europe, where it was refined and became essential in military and naval tactics. Its invention marked the beginning of the gunpowder age, reshaping armies, fortifications, and the balance of power globally."

vanilia:0 "Vanilla"
vaniliaDESC:0 "Vanilla is a fragrant and flavorful spice derived from the pods of orchids, primarily grown in tropical regions like Mexico, Madagascar, and parts of Southeast Asia. Known for its warm, sweet aroma, vanilla is prized as a luxury ingredient in culinary and perfumery applications. Cultivation is labor-intensive, requiring hand-pollination and careful curing of the pods, which contributes to its high value. Historically, vanilla was a sought-after commodity in European markets, where it was used to flavor desserts, chocolates, and beverages. Its distinctive flavor and rarity make it one of the world’s most cherished spices."

maplesyrup:0 "Maple Syrup"
maplesyrupDESC:0 "Maple syrup is a sweet, amber-colored syrup made from the sap of sugar maple trees, primarily in North America. The process involves tapping trees to collect sap and then boiling it down to concentrate its natural sugars, resulting in a rich, caramel-like flavor. Originating with Indigenous peoples and later adopted by European settlers, maple syrup became a treasured food item and a cultural icon of regions like Canada and New England. Valued as a natural sweetener, maple syrup is used in baking, cooking, and as a topping, and remains a symbol of North American culinary heritage."

mercury:0 "Mercury"
mercuryDESC:0 "Mercury is a dense, silvery liquid metal that remains in liquid form at room temperature, making it unique among metals. Known since ancient times, mercury was historically used in medicine, alchemy, and in extracting precious metals like gold and silver. Despite its toxicity, mercury was prized for its reflective appearance and used in applications such as mirrors and scientific instruments. Found in deposits like cinnabar ore, mercury’s rarity and versatility made it valuable in various industries, although its use has declined due to health and environmental concerns."

sulphur:0 "Sulphur"
sulphurDESC:0 "Sulphur is a bright yellow, non-metallic element commonly found near volcanic areas and hot springs. Known since antiquity, sulphur was used in early medicine, alchemy, and religious rituals. Its unique odor and flammability made it a key ingredient in ancient gunpowder recipes, and it was essential for early explosives and metallurgy. Sulphur is also widely used in modern industry, especially in fertilizers, chemicals, and pharmaceuticals. Its versatility and reactivity have made it valuable across cultures and centuries, especially in military, agricultural, and industrial applications."

lead:0 "Lead"
leadDESC:0 "Lead is a dense, soft, bluish-gray metal known for its malleability and resistance to corrosion. Used since ancient times, lead was essential in the production of pipes, roofing, and paints due to its durability and ease of shaping. It was also widely used in ammunition and printing typesetting. Although prized for centuries, lead’s toxicity became evident over time, leading to restrictions in its use. Despite health concerns, lead remains important in specific industries today, especially in batteries, radiation shielding, and certain alloys, due to its unique properties."

exoticfur:0 "Exotic Fur"
exoticfurDESC:0 "Exotic furs such as leopard, sable, and ermine were luxury goods sought after by European and Asian elites. Valued for their rarity and striking appearance, they were symbols of nobility and power. Traded along expanding global routes, these furs moved from Africa, Russia, and the Americas to courts and cities across Europe and the Ottoman Empire, often rivaling silks and spices in prestige."

amber:0 "Amber"
amberDESC:0 "Amber is a fossilized tree resin valued for its beauty and historical significance. It ranges in color from yellow to deep orange and is often used in jewelry and decorative items. In the early modern period, amber was a sought-after trade good, prized for its use in art, adornment, and believed medicinal properties. It was commonly traded in markets across Europe and Asia, contributing to its economic importance."

diamonds:0 "Diamonds"
diamondsDESC:0 "Diamonds are precious gemstones made of crystallized carbon, formed under high pressure and temperature deep within the Earth. Mined historically in India (Golconda), later in Brazil, Africa, and beyond, they are valued for their hardness, brilliance, and rarity. Used in jewelry and industry, diamonds symbolize wealth, love, and durability."

cola:0 "Kola Nuts"
 colaDESC:0 "Kola nuts were a valuable West African trade good, chewed for their stimulating properties and used in social, ritual, and medicinal contexts. Their bitterness and caffeine content made them prized by travelers, workers, and local communities, while their portability encouraged long-distance exchange. Kola traveled across Saharan and Atlantic trade networks, becoming a symbol of hospitality and wealth in many markets. Local rulers and merchants often regulated their sale because of their high value and cultural importance."

 building_vineyard_estate: "Vineyard"
 building_vineyard_estate_desc: "§gA wine estate is a self-sufficient property where vineyards and winemaking facilities coexisted, often owned by nobles, monasteries, or wealthy landowners. These estates produced wine for local consumption, trade, or religious purposes, with production tied to the estate's land and labor system.§!"
 
 building_sawmill: "Sawmill"
 building_sawmill_desc: "§gA sawmill is a facility where logs are processed into timber or planks, typically used in construction, furniture making, and other industries. It operates using machinery like saws and conveyors to efficiently cut, shape, and prepare wood for various applications.§!"
 
