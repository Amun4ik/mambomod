l_english:
 compostela_cathedral:0 "Santiago de Compostela Cathedral"
 compostela_cathedral_desc:0 "§gThe archcathedral basilica has historically been a place of pilgrimage on the Way of St James since the Early Middle Ages and marks the traditional end of the pilgrimage route. The building is a Romanesque structure, with later Gothic and Baroque additions."

 pisatower:0 "Pisa Cathedral"
 pisatower_desc:0 "§gA freestanding bell tower located in Pisa's cathedral square. Constructed over 199 years, starting in 1173, the tower's tilt resulted from unstable foundation soil. The tower's construction faced interruptions, including wars, yet it remains a remarkable example of medieval architecture.§!"

 colosseum:0 "Colosseum"
 colosseum_desc:0 "§gAn iconic ancient Roman amphitheater located in the heart of the city. Constructed during the 1st century AD, it is one of the most well-preserved and recognizable symbols of ancient Rome and a testament to Roman engineering and architecture. The Colosseum was primarily used for gladiatorial contests and public spectacles, hosting events that ranged from thrilling combat between gladiators to mock sea battles. Its elliptical design could accommodate an estimated 50,000 to 80,000 spectators.§!"

 globe_theatre:0 "Globe Theatre"
 globe_theatre_desc:0 "§gA renowned playhouse in London, closely associated with William Shakespeare - one of the most celebrated playwrights in history. This open-air, circular theater can accommodate a diverse audience, from groundlings who stand in the yard to wealthier patrons who have seating. The Globe is known for its distinctive thatched roof and its minimalistic yet effective set designs.§!"

 mont_saint_michel:0 "Mont-Saint-Michel"
 mont_saint_michel_desc:0 "§gA small rocky island located off the northwestern coast of Normandy, famous for its stunning medieval abbey and picturesque village that appear to rise from the sea. The island's history dates back to the 8th century when the abbey was founded, and it has been a place of religious pilgrimage and fortification. The abbey's architecture is a remarkable blend of Romanesque and Gothic styles. Its narrow, winding streets are lined with historic buildings, including restaurants, shops, and quaint residences. Mont-Saint-Michel is also known for its dramatic tides, which can vary greatly, transforming the island from a peninsula to an isolated island.§!"

 cashel:0 "Rock of Cashel"
cashel_desc:0 "§gThe Rock of Cashel, also known as St. Patrick's Rock, is a historic site located in County Tipperary, Ireland. It is a spectacular collection of medieval buildings set on a limestone outcrop. The site includes a 12th-century round tower, a High Cross, a Romanesque chapel (Cormac's Chapel), a Gothic cathedral, and a 15th-century castle. Once the seat of the kings of Munster, the Rock of Cashel is associated with St. Patrick, who is said to have converted King Aengus to Christianity there in the 5th century.§!"

 brusselscityhall:0 "Brussels Town Hall"
 brusselscityhall_desc:0 "§gA historic architectural masterpiece in the heart of the city. Constructed in the early 15th century, this Gothic-style building is emblematic of the city's rich history. It served as the administrative and civic center for the city, showcasing its political and economic importance during the Middle Ages. The Town Hall is celebrated for its intricate facade, adorned with statues and spires, and its magnificent tower, which soars to over 300 feet.§!"

 louvre:0 "Louvre"
 louvre_desc:0 "§gThe Louvre is the world's largest art museum and a historic monument. Originally a royal palace, it became a public museum in 1793 during the French Revolution. It was initially displaying a collection of 537 paintings, mostly from the royal collections and confiscated church property. The museum's mission was to make art accessible to all citizens. During this period, the Louvre expanded its collections through acquisitions and the spoils of Napoleonic wars. Napoleon Bonaparte played a crucial role, renaming the museum the 'Musée Napoléon' in 1803. Under his rule, art treasures from across Europe were brought to the Louvre, significantly enriching its collections. However, after Napoleon's defeat in 1815, many of these artworks were returned to their countries of origin. The museum continued to grow and develop its public education role, with regular additions to its collections and improvements in its display techniques that firmly established Louvre as a premier institution for art and culture.§!"

sanktgallabbey:0 "Abbey of Saint Gall"
sanktgallabbey_desc:0 "§gThe Abbey of Saint Gall is a renowned historic monastery founded in the 8th century by Saint Othmar. It became one of Europe's most important cultural and educational centers during the Middle Ages, renowned for its impressive library, which houses a vast collection of medieval manuscripts and rare books. The abbey complex, later featuring a stunning Baroque cathedral with elaborate interiors, is one of the most significant examples of Baroque architecture in Switzerland.§!"

saintmarkbasilica:0 "St Mark's Basilica"
saintmarkbasilica_desc:0 "§gSt. Mark's Basilica is a stunning example of Italo-Byzantine architecture and one of the city's most famous landmarks. Completed in 1094, the basilica serves as the cathedral of Venice and is renowned for its opulent design, intricate mosaics, and impressive domes. The interior is adorned with gold mosaics depicting biblical scenes, and the Pala d'Oro, a golden altarpiece, is a highlight. The basilica's façade features a blend of Eastern and Western architectural elements, reflecting Venice's historical connections with both the Byzantine Empire and Western Europe.§!"