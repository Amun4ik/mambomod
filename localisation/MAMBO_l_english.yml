 mamboprices.1.t: "The Beer Purity Law"
 mamboprices.1.d: "Our brewers have long complained of inferior ingredients and dishonest practices, and our princes have heard them. In 1516, we proclaim the Reinheitsgebot, restricting beer to barley, hops, and water. Though the decree is meant to regulate prices and protect our brewers, it soon becomes a mark of quality. Merchants across Europe begin to seek out beer brewed under our law, and the demand for pure beer rises throughout the known world."
 mamboprices.1.a: "Enact the Beer Purity Law"
 REINHEITSGEBOT: "Reinheitsgebot"
 
 mamboprices.2.t: "The Saltpeter Works"
 mamboprices.2.d: "As gunpowder warfare expands, our realm — rich in sulphur — establishes a network of royal saltpeter works. Our new refineries produce gunpowder ingredients on an unprecedented scale, lowering the price of gunpowder across the world. Yet the demand for sulphur rises sharply, turning our deposits into a strategic resource coveted by every warring nation."
 mamboprices.2.a: "Found the Saltpeter Works"
 SALTPETER: "Saltpeter Works"
 
